// VYRE DJ beginner keyboard layout.
// Tab selects Deck A/B. All [VYREActiveDeck] commands follow that selection.

[VYRE]
select Tab

[VYREActiveDeck]
beatloop_activate Esc
beatloop_1_toggle 1
beatloop_2_toggle 2
beatloop_4_toggle 4
beatloop_8_toggle 5
beatloop_16_toggle 6
beatloop_32_toggle 7
loop_halve 8
loop_double 9
reloop_toggle 0

effect_active_1 q
effect_active_2 w
effect_active_3 e
play p
play_space Space
stop d
filter_activate z
cue_default c
rate_set_default Backspace
rate_temp_up_small Left
rate_temp_down_small Right

[Sampler1]
start_stop F1
[Sampler2]
start_stop F2
[Sampler3]
start_stop F3
[Sampler4]
start_stop F4
[Sampler5]
start_stop F5
[Sampler6]
start_stop F6
[Sampler7]
start_stop F7
[Sampler8]
start_stop F8
[Sampler9]
start_stop F9
[Sampler10]
start_stop F10
[Sampler11]
start_stop F11
[Sampler12]
start_stop F12

[KeyboardShortcuts]
FileMenu_LoadDeck1 Ctrl+o
FileMenu_LoadDeck2 Ctrl+Shift+O
FileMenu_Quit Ctrl+q
LibraryMenu_NewPlaylist Ctrl+n
LibraryMenu_NewCrate Ctrl+Shift+N
ViewMenu_ShowSkinSettings Ctrl+1
ViewMenu_ShowMicrophone Ctrl+2
ViewMenu_ShowVinylControl Ctrl+3
ViewMenu_ShowPreviewDeck Ctrl+4
ViewMenu_ShowEffects Ctrl+5
ViewMenu_ShowCoverArt Ctrl+6
OptionsMenu_EnableLiveBroadcasting Ctrl+l
OptionsMenu_RecordMix Ctrl+r
OptionsMenu_ReloadSkin Ctrl+Shift+R
OptionsMenu_DeveloperTools Ctrl+Shift+T
OptionsMenu_DeveloperStatsExperiment Ctrl+Shift+E
OptionsMenu_DeveloperStatsBase Ctrl+Shift+B
DeveloperMenu_EnableDebugger Ctrl+Shift+D
OptionsMenu_EnableShortcuts Ctrl+`
